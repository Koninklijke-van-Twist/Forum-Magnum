name: Tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, curl, mbstring
      - name: Lint
        run: find web tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: for f in tests/*_test.php; do php "$f" || exit 1; done
